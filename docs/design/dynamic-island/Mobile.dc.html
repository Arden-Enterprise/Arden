<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arden — Mobile Members</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg-app:#101014;--bg-sidebar:#15151a;--surface:#1c1c23;--surface-raised:#25252e;--surface-hover:rgb(255 255 255 / 4%);--border:#303039;--text-primary:#f2f1f7;--text-secondary:#a5a4b1;--text-muted:#8c8b98;--accent:#8b82f6;--accent-hover:#a69eff;--accent-subtle:rgb(139 130 246 / 14%);--accent-border:rgb(139 130 246 / 38%);--text-on-accent:#101014;--focus-ring:#a69eff;--success:#7fcfa3;--info:#7eb0f0}
body{margin:0}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.di{background:var(--surface-raised);border:1px solid var(--border);color:var(--text-primary);box-sizing:border-box;box-shadow:0 18px 40px -18px rgb(0 0 0 / 85%)}
.mc{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text-primary);text-align:left;text-decoration:none;box-sizing:border-box}
.mc:hover{background:#202028}
.av{width:40px;height:40px;flex:none;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font:600 12px/1 "Inter Tight",Inter,sans-serif;color:var(--text-primary)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:56px;border-radius:10px;color:var(--text-secondary);text-decoration:none;font-size:11px;font-weight:600;position:relative}
.tab.on{background:var(--accent-subtle);color:var(--text-primary)}
.tab.on svg{color:var(--accent-hover)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.pt{flex:none;display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);color:var(--text-secondary);text-decoration:none;font-weight:600;font-size:13px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg-app); color: var(--text-primary); font-family: Inter, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss03'">

  <!-- TOP ISLAND -->
  <div style="position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: center; z-index: 3">
    <div class="di" role="region" aria-label="Status island" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 4px 0 6px; border-radius: 12px; width: 250px">
      <button type="button" aria-label="Switch organization — Northstar Studio" style="width: 32px; height: 32px; border-radius: 7px; border: 0; background: var(--text-primary); color: var(--bg-app); font: 600 11px/1 'Inter Tight', Inter, sans-serif; cursor: pointer">NS</button>
      <span style="flex: 1; font-weight: 600; font-size: 13px; text-align: center">Members</span>
      <button type="button" aria-label="Search" style="width: 36px; height: 36px; border-radius: 8px; border: 0; background: var(--surface); color: var(--text-secondary); display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    </div>
  </div>

  <!-- CONTENT -->
  <div style="position: absolute; top: 72px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 8px 16px 120px; box-sizing: border-box">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--text-muted)">MANAGE ORGANIZATION</div>
    <div style="display: flex; align-items: center; gap: 10px; margin: 2px 0 12px">
      <h1 style="margin: 0; flex: 1; font: 600 28px/1.2 'Inter Tight', Inter, sans-serif; letter-spacing: -.03em">Members</h1>
      <a href="#" aria-label="Invite members" style="width: 44px; height: 44px; border-radius: 10px; background: var(--accent); color: var(--text-on-accent); display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
    </div>
    <nav aria-label="Administration sections" style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px; margin: 0 -16px; padding-left: 16px; padding-right: 16px">
      <a href="#" aria-current="page" class="pt" style="background: var(--accent-subtle); color: var(--text-primary); border-color: var(--accent-border)">Members · 48</a>
      <a href="#" class="pt">Departments</a>
      <a href="#" class="pt">Audiences</a>
      <a href="#" class="pt">Invitations · 3</a>
      <a href="#" class="pt">Reviewer access</a>
    </nav>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{ members }}" as="m" hint-placeholder-count="7">
        <a href="#" class="mc" aria-label="Open details for {{ m.name }}">
          <span class="av" style="background: {{ m.avBg }}">{{ m.ini }}</span>
          <span style="flex: 1; min-width: 0; line-height: 1.35">
            <span style="display: block; font-weight: 600">{{ m.name }}</span>
            <span style="display: block; font-size: 12px; color: var(--text-secondary)">{{ m.role }} · {{ m.dept }}</span>
          </span>
          <span class="st" style="color: {{ m.stC }}"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 999px; background: currentColor"></span>{{ m.status }}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#777683" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </sc-for>
    </div>
  </div>

  <!-- TAB ISLAND -->
  <nav class="di" aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 20px; z-index: 3; display: flex; gap: 2px; padding: 6px; border-radius: 16px">
    <a class="tab" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>My Work</a>
    <a class="tab" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Library</a>
    <a class="tab" href="#" aria-label="Reviews, 3 assigned"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 13l2 2 4-4"/></svg>Reviews<span aria-hidden="true" style="position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 5px; background: var(--accent); color: var(--text-on-accent); font-size: 10px; display: inline-flex; align-items: center; justify-content: center">3</span></a>
    <a class="tab on" href="#" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>Admin</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { Active: 'var(--success)', Invited: 'var(--info)', Deactivated: 'var(--text-secondary)' };
    const M = [
      { name: 'Linh Pham', dept: 'Engineering', role: 'Org Admin · Reviewer', status: 'Active', ini: 'LP', avBg: '#2c2b3a' },
      { name: 'Minh Tran', dept: 'Engineering', role: 'Member · Reviewer', status: 'Active', ini: 'MT', avBg: '#2a2d33' },
      { name: 'An Le', dept: 'Engineering', role: 'Member', status: 'Active', ini: 'AL', avBg: '#2a3030' },
      { name: 'Quynh Do', dept: 'Operations', role: 'Member · Reviewer', status: 'Active', ini: 'QD', avBg: '#322b33' },
      { name: 'Bao Nguyen', dept: 'Design', role: 'Member', status: 'Invited', ini: 'BN', avBg: '#2c2b3a' },
      { name: 'Hoa Vu', dept: 'Operations', role: 'Member', status: 'Active', ini: 'HV', avBg: '#2a2d33' },
      { name: 'Khang Ho', dept: 'Design', role: 'Member · Reviewer', status: 'Active', ini: 'KH', avBg: '#2a3030' },
      { name: 'Thu Ha', dept: 'Engineering', role: 'Member', status: 'Deactivated', ini: 'TH', avBg: '#322b33' }
    ];
    return { members: M.map((m) => Object.assign({}, m, { stC: C[m.status] })) };
  }
}
</script>
</body>
</html>
