# Fresh demo session as the sample Member (no backend needed).
# Sign-in page -> Demo -> Member -> "Choose your workspace" -> Continue.
url: http://127.0.0.1:5180/?preview=1
name: Subflow - sign in to demo as Member
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 30000
- tapOn: "Demo"
- tapOn: "Member"
- extendedWaitUntil:
    visible: "Choose your workspace"
    timeout: 10000
- tapOn: "Continue to workspace"
- extendedWaitUntil:
    visible: "Private Notes"
    timeout: 15000
