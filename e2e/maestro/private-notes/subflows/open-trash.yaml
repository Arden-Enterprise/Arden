# Open Trash from the account menu at the bottom-left of the sidebar.
# The account button has no dedicated label yet; it shows the demo member
# name "Lan Nguyen". Prefer an accessible name such as "Account menu".
url: http://127.0.0.1:5180/?preview=1
name: Subflow - open Trash from the account menu
---
