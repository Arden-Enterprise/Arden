# Create a note without a collection named ${NAME} from the Private Notes header.
# Icon-only button: Maestro web exposes aria-label as resource-id -> `id:`.
url: http://127.0.0.1:5180/
name: Subflow - create a note at the top level
---
- tapOn:
    id: "New note"
- runFlow:
    file: name-new-item.yaml
    env:
      NAME: ${NAME}
