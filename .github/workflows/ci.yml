name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARDEN_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}

jobs:
  check:
    if: github.repository == 'Arden-Enterprise/Arden' && github.event.repository.visibility == 'public'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    concurrency:
      group: checks-${{ github.event.pull_request.number || github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, dereferenced commit
        with:
          version: 11.19.0
          run_install: false
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Validate migration inventory and immutable history
        shell: bash
        env:
          ARDEN_MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: node tools/releases/migrations.mjs check --base "$ARDEN_MIGRATION_BASE_SHA"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:remote
      - name: Release client and branch policy tests
        run: node --test tools/releases/release.test.mjs tools/releases/transport.test.mjs tools/releases/identity.test.mjs tools/releases/migration-inventory.test.mjs tools/pull-requests/conventions.test.mjs
      - name: Prepare temporary release-verifier test environment without pip caching
        run: python tools/releases/setup-python.py
      - name: Release protocol tests (Windows)
        if: runner.os == 'Windows'
        run: '& "$env:ARDEN_RELEASE_PYTHON" -m unittest discover -s deploy/release/tests -v'
      - name: Release protocol and privilege tests (Linux)
        if: runner.os == 'Linux'
        run: sudo --non-interactive "$ARDEN_RELEASE_PYTHON" -m unittest discover -s deploy/release/tests -v
      - name: Hosted protocol and maintenance fence tests (Linux)
        if: runner.os == 'Linux'
        run: sudo --non-interactive python3 -m unittest discover -s deploy/hosted/tests -v
      - run: pnpm build

  database:
    name: Disposable PostgreSQL authorization tests
    if: github.repository == 'Arden-Enterprise/Arden' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: database-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: pgvector/pgvector:pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_DB: arden_test_ci
          POSTGRES_PASSWORD: disposable_ci_only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Rehearse scoped schema backup, upgrade failure and restoration
        run: python3 tools/verification/schema-recovery.py
        env:
          ARDEN_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Verify release migration role ownership and denial boundaries
        run: python3 tools/verification/migration-owner.py
        env:
          ARDEN_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Apply all migrations only to the disposable runner database
        run: pnpm --filter @arden/api db:migrate
        env:
          ARDEN_MIGRATION_DATABASE_URL: postgresql://postgres:disposable_ci_only@127.0.0.1:5432/arden_test_ci
      - name: Verify a repeated full-chain migration is an idempotent no-op
        run: pnpm --filter @arden/api db:migrate
        env:
          ARDEN_MIGRATION_DATABASE_URL: postgresql://postgres:disposable_ci_only@127.0.0.1:5432/arden_test_ci
      - name: Exercise actual PostgreSQL isolation and permission rules
        run: pnpm --filter @arden/api test
        env:
          ARDEN_TEST_DATABASE_URL: postgresql://postgres:disposable_ci_only@127.0.0.1:5432/arden_test_ci
      - name: Build API for real startup isolation regression
        run: pnpm --filter @arden/api build
      - name: API remains available without optional indexing credentials
        run: node tools/verification/api-optional-indexer.mjs
        env:
          ARDEN_TEST_DATABASE_URL: postgresql://postgres:disposable_ci_only@127.0.0.1:5432/arden_test_ci

  image-check:
    name: Image build and security checks
    needs: [check, database]
    if: >-
      github.repository == 'Arden-Enterprise/Arden' && github.event.repository.visibility == 'public' &&
      (github.event_name != 'push' || (github.ref_name != 'staging' && github.ref_name != 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: image-check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Build and scan without retained cache or registry publication
        run: node tools/releases/build.mjs

  release:
    name: Deploy verified app release
    needs: [check, database]
    if: >-
      github.repository == 'Arden-Enterprise/Arden' && github.event.repository.visibility == 'public' &&
      github.event_name == 'push' && (github.ref_name == 'staging' || github.ref_name == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: arden-shared-host-activation
      cancel-in-progress: false
      queue: max
    environment:
      name: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
      url: ${{ github.ref_name == 'staging' && 'https://staging.ardenai.tech' || 'https://ardenai.tech' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Check restricted deployment connection before image work
        timeout-minutes: 2
        run: node tools/releases/release.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      - name: Build and scan the staging image pair on temporary runner disk
        if: github.ref_name == 'staging'
        run: node tools/releases/build.mjs
      - name: Prepare bounded temporary staging image archive
        if: github.ref_name == 'staging'
        run: node tools/releases/release.mjs bundle
      - name: Upload staging or promote the identical verified images to production
        run: node tools/releases/release.mjs deploy
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      - name: Remove only this job's temporary image archive and key files
        if: always()
        run: node tools/releases/release.mjs cleanup
