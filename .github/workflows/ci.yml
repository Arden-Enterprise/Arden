name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force_ai_deploy:
        description: "Force staging AI rebuild and deploy (staging branch only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  ARDEN_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}

jobs:
  check:
    if: github.repository == 'Arden-Enterprise/Arden' && github.event.repository.visibility == 'public'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    concurrency:
      group: checks-${{ github.event.pull_request.number || github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, dereferenced commit
        with:
          version: 11.19.0
          run_install: false
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Validate migration inventory and immutable history
        shell: bash
        env:
          ARDEN_MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: node tools/releases/migrations.mjs check --base "$ARDEN_MIGRATION_BASE_SHA"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:remote
      - name: Release client and branch policy tests
        run: node --test tools/releases/release.test.mjs tools/releases/transport.test.mjs tools/releases/identity.test.mjs tools/releases/migration-inventory.test.mjs tools/releases/ai-contract-parity.test.mjs tools/releases/ai-identity.test.mjs tools/releases/ai-release.test.mjs tools/pull-requests/conventions.test.mjs
      - name: Verify AI contract parity, Chroma pin, and Dockerfile hardening
        run: node tools/releases/ai-contract-parity.mjs
      - name: Prepare temporary release-verifier test environment without pip caching
        run: python tools/releases/setup-python.py
      - name: Release protocol tests (Windows)
        if: runner.os == 'Windows'
        run: '& "$env:ARDEN_RELEASE_PYTHON" -m unittest discover -s deploy/release/tests -v'
      - name: AI release protocol tests (Windows)
        if: runner.os == 'Windows'
        run: '& "$env:ARDEN_RELEASE_PYTHON" -m unittest discover -s deploy/release-ai/tests -v'
      - name: Release protocol and privilege tests (Linux)
        if: runner.os == 'Linux'
        run: sudo --non-interactive "$ARDEN_RELEASE_PYTHON" -m unittest discover -s deploy/release/tests -v
      - name: AI release protocol and privilege tests (Linux)
        if: runner.os == 'Linux'
        run: sudo --non-interactive "$ARDEN_RELEASE_PYTHON" -m unittest discover -s deploy/release-ai/tests -v
      - name: Hosted protocol and maintenance fence tests (Linux)
        if: runner.os == 'Linux'
        run: sudo --non-interactive python3 -m unittest discover -s deploy/hosted/tests -v
      - run: pnpm build

  database:
    name: Disposable PostgreSQL authorization tests
    if: github.repository == 'Arden-Enterprise/Arden' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: database-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: pgvector/pgvector:pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_DB: arden_test_ci
          POSTGRES_PASSWORD: disposable_ci_only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, dereferenced commit
        with:
          version: 11.19.0
          run_install: false
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Rehearse scoped schema backup, upgrade failure and restoration
        run: python3 tools/verification/schema-recovery.py
        env:
          ARDEN_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Verify release migration role ownership and denial boundaries
        run: python3 tools/verification/migration-owner.py
        env:
          ARDEN_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Apply all migrations only to the disposable runner database
        run: pnpm --filter @arden/api db:migrate
        env:
          ARDEN_MIGRATION_DATABASE_URL: postgresql://postgres:disposable_ci_only@127.0.0.1:5432/arden_test_ci
      - name: Verify a repeated full-chain migration is an idempotent no-op
        run: pnpm --filter @arden/api db:migrate
        env:
          ARDEN_MIGRATION_DATABASE_URL: postgresql://postgres:disposable_ci_only@127.0.0.1:5432/arden_test_ci
      - name: Transfer real schema ownership before exercising application workflows
        run: python3 tools/verification/migration-owner.py --full-schema
        env:
          ARDEN_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Exercise actual PostgreSQL isolation and permission rules after ownership transfer
        run: pnpm --filter @arden/api test
        env:
          ARDEN_TEST_DATABASE_URL: postgresql://postgres:disposable_ci_only@127.0.0.1:5432/arden_test_ci
      - name: Build API for real startup isolation regression
        run: pnpm --filter @arden/api build
      - name: API remains available without optional indexing credentials
        run: node tools/verification/api-optional-indexer.mjs
        env:
          ARDEN_TEST_DATABASE_URL: postgresql://postgres:disposable_ci_only@127.0.0.1:5432/arden_test_ci

  ai-check:
    name: AI service checks and container scan
    if: github.repository == 'Arden-Enterprise/Arden' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      ai_changed: ${{ steps.changes.outputs.ai_changed }}
      tooling_changed: ${{ steps.changes.outputs.tooling_changed }}
    concurrency:
      group: ai-check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Detect AI service changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          AI_PATHS=(
            services/ai
            tools/releases/ai-build.mjs
            tools/releases/ai-smoke.mjs
            tools/releases/ai-release.mjs
            tools/releases/ai-identity.mjs
            tools/releases/ai-contract-parity.mjs
            deploy/release-ai
            .github/workflows/release-ai.yml
          )
          TOOLING_PATHS=(
            tools/releases/ai-build.mjs
            tools/releases/ai-smoke.mjs
            tools/releases/ai-release.mjs
            tools/releases/ai-identity.mjs
            deploy/release-ai
            .github/workflows/release-ai.yml
          )
          BASE_SHA="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          AI_CHANGED="false"
          TOOLING_CHANGED="false"
          CI_CHANGED="false"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            AI_CHANGED="true"
            TOOLING_CHANGED="true"
          else
            if git diff --name-only "$BASE_SHA" HEAD -- "${AI_PATHS[@]}" | grep -q .; then
              AI_CHANGED="true"
            fi
            if git diff --name-only "$BASE_SHA" HEAD -- "${TOOLING_PATHS[@]}" | grep -q .; then
              TOOLING_CHANGED="true"
            fi
            if git diff --name-only "$BASE_SHA" HEAD -- .github/workflows/ci.yml | grep -q .; then
              CI_CHANGED="true"
            fi
          fi
          RUN_CHECK="false"
          if [ "$AI_CHANGED" = "true" ] || [ "$CI_CHANGED" = "true" ] || [ "$EVENT_NAME" = "workflow_dispatch" ] || ([ "$EVENT_NAME" = "push" ] && ([ "$REF_NAME" = "staging" ] || [ "$REF_NAME" = "main" ])); then
            RUN_CHECK="true"
          fi
          echo "run=${RUN_CHECK}" >> "$GITHUB_OUTPUT"
          echo "ai_changed=${AI_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "tooling_changed=${TOOLING_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "AI change detection: run=${RUN_CHECK}, ai_changed=${AI_CHANGED}, tooling_changed=${TOOLING_CHANGED}"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.changes.outputs.run == 'true'
        with:
          enable-cache: false
          python-version: "3.11"
      - name: Install AI dependencies and run pytest, ruff, and mypy
        if: steps.changes.outputs.run == 'true'
        working-directory: services/ai
        env:
          UV_NO_CACHE: "1"
        run: |
          uv sync --frozen
          uv run pytest -q
          uv run ruff check .
          uv run mypy
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Build, Trivy-scan, and smoke-test AI runtime image
        if: steps.changes.outputs.run == 'true'
        run: node tools/releases/ai-build.mjs

  image-check:
    name: Image build and security checks
    needs: [check, database]
    if: >-
      github.repository == 'Arden-Enterprise/Arden' && github.event.repository.visibility == 'public' &&
      (github.event_name != 'push' || (github.ref_name != 'staging' && github.ref_name != 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: image-check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Build and scan without retained cache or registry publication
        run: node tools/releases/build.mjs

  release-ai:
    name: Deploy verified AI release
    needs: [check, ai-check]
    if: >-
      github.repository == 'Arden-Enterprise/Arden' &&
      github.event.repository.visibility == 'public' &&
      (
        (github.event_name == 'push' && (github.ref_name == 'staging' || github.ref_name == 'main') && needs.ai-check.outputs.ai_changed == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.ref_name == 'staging' && inputs.force_ai_deploy == true)
      )
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-ai.yml
    with:
      target_environment: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
      tooling_changed: ${{ needs.ai-check.outputs.tooling_changed == 'true' }}
      force_ai_deploy: ${{ github.event_name == 'workflow_dispatch' && inputs.force_ai_deploy == true }}

  release:
    name: Deploy verified app release
    needs: [check, database, release-ai]
    if: >-
      always() && !cancelled() &&
      needs.check.result == 'success' &&
      needs.database.result == 'success' &&
      (needs.release-ai.result == 'success' || needs.release-ai.result == 'skipped') &&
      github.repository == 'Arden-Enterprise/Arden' &&
      github.event.repository.visibility == 'public' &&
      github.event_name == 'push' &&
      (github.ref_name == 'staging' || github.ref_name == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: arden-shared-host-activation
      cancel-in-progress: false
      queue: max
    environment:
      name: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
      url: ${{ github.ref_name == 'staging' && 'https://staging.ardenai.tech' || 'https://ardenai.tech' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Check restricted deployment connection before image work
        timeout-minutes: 2
        run: node tools/releases/release.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      - name: Build and scan the staging image pair on temporary runner disk
        if: github.ref_name == 'staging'
        run: node tools/releases/build.mjs
      - name: Prepare bounded temporary staging image archive
        if: github.ref_name == 'staging'
        run: node tools/releases/release.mjs bundle
      - name: Upload staging or promote the identical verified images to production
        run: node tools/releases/release.mjs deploy
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      - name: Remove only this job's temporary image archive and key files
        if: always()
        run: node tools/releases/release.mjs cleanup
