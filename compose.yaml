services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: arden
      POSTGRES_PASSWORD: arden_dev_only
      POSTGRES_DB: arden
    ports:
      - "127.0.0.1:${ARDEN_POSTGRES_PORT:-5433}:5432"
    volumes:
      - arden_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arden -d arden"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  arden_postgres_data:
